services:
  nis:
    container_name: nis
    build: ./.docker/nis
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "7778:7778"
      - "7890:7890"
    restart: always
    stop_signal: SIGINT
    volumes:
      - ./data:/root/nem:rw
      - ./.docker/nis/config-user.properties:/package/nis/config-user.properties:ro
